name: Deployment

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dranov220805/ltt-ltc-web-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.API_URL }} \
            -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest
      # Connect Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      # Setup SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.109.240.84 >> ~/.ssh/known_hosts
      # Deploy on server
      - name: SSH Deploy
        run: |
          ssh -o StrictHostKeyChecking=no dranov@100.109.240.84 << 'EOF'
            docker pull dranov220805/ltt-ltc-web-app:latest
            cd /home/dranov/Desktop/ltt-ltc
            # Stop old container
            docker compose down
            # Update image and restart
            docker compose up -d
          EOF
