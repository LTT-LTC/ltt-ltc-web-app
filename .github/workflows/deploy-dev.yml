name: Deployment

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dranov220805/ltt-ltc-web-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.API_URL }} \
            -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest
      # Connect Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      # Setup SSH - Connect to Swarm Manager (Server 1)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.99.158.16 >> ~/.ssh/known_hosts
      # Deploy to Docker Swarm
      - name: SSH Deploy to Swarm
        run: |
          ssh kaka-server@100.99.158.16 << EOF
            set -e
            echo "Updating ltt-ltc-web-app service in Docker Swarm..."
            docker service update --detach --image $IMAGE_NAME:latest --force ltt-ltc_ltt-ltc-web-app
            echo "Update triggered. Waiting 90s for convergence..."
            sleep 90
            docker service ps ltt-ltc_ltt-ltc-web-app
            REPLICAS=\$(docker service ls --filter name=ltt-ltc_ltt-ltc-web-app --format '{{.Replicas}}')
            echo "Replicas: \$REPLICAS"
            if [ "\$REPLICAS" != "1/1" ]; then
              echo "ERROR: Service did not converge (got \$REPLICAS)"
              docker service logs ltt-ltc_ltt-ltc-web-app --tail 30
              exit 1
            fi
            echo "Deployment complete!"
          EOF
